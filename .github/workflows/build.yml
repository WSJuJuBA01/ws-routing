name: Build WS Routing RU

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: ws-routing-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Download geoip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 3 \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat \
            -o dist/geoip.dat
          test -s dist/geoip.dat

      - name: Prepare geosite source
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            domain-list-community

          cp -a domain-list-community/data custom-data

          # Собственная категория российских доменов.
          cat > custom-data/ws-ru <<'EOF'
          domain:yandex.ru
          domain:yandex.net
          domain:ya.ru
          domain:yastatic.net
          domain:vk.com
          domain:vk.ru
          domain:userapi.com
          domain:mail.ru
          domain:ok.ru
          domain:gosuslugi.ru
          domain:nalog.gov.ru
          domain:mos.ru
          domain:sberbank.ru
          domain:vtb.ru
          domain:alfabank.ru
          domain:tbank.ru
          domain:ozon.ru
          domain:wildberries.ru
          domain:avito.ru
          domain:2gis.ru
          domain:rzd.ru
          domain:rbc.ru
          domain:ria.ru
          domain:tass.ru
          domain:lenta.ru
          domain:dzen.ru
          domain:rutube.ru
          domain:ivi.ru
          domain:kinopoisk.ru
          EOF

          # Загружаем актуальный список торрент-доменов.
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/blocklistproject/Lists/master/torrent.txt \
            -o /tmp/torrent-source.txt

          python3 - <<'PY'
          import re
          from pathlib import Path

          domains = set()

          for line in Path("/tmp/torrent-source.txt").read_text(
              encoding="utf-8", errors="ignore"
          ).splitlines():
              line = line.split("#", 1)[0].strip().lower()
              if not line:
                  continue

              parts = line.split()
              host = parts[-1].strip(".")

              if host in {"localhost", "local", "broadcasthost"}:
                  continue

              if re.fullmatch(
                  r"(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))+",
                  host
              ):
                  domains.add(host)

          if not domains:
              raise SystemExit("ERROR: torrent domain list is empty")

          Path("custom-data/category-bittorrent").write_text(
              "".join(f"domain:{d}\n" for d in sorted(domains)),
              encoding="utf-8"
          )

          Path("dist/category-bittorrent.txt").write_text(
              "".join(f"{d}\n" for d in sorted(domains)),
              encoding="utf-8"
          )

          print(f"Torrent domains: {len(domains)}")
          PY

          cp data/ru-domains.txt dist/ru-domains.txt

      - name: Build geosite database
        shell: bash
        run: |
          set -euo pipefail

          cd domain-list-community
          go run . --datapath="$GITHUB_WORKSPACE/custom-data"

          test -s dlc.dat
          cp dlc.dat "$GITHUB_WORKSPACE/dist/geosite.dat"

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/geosite.dat
          test -s dist/geoip.dat
          test -s dist/category-bittorrent.txt
          test -s dist/ru-domains.txt
          cd dist
          sha256sum geosite.dat geoip.dat \
            category-bittorrent.txt ru-domains.txt > SHA256SUMS

      - name: Publish release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          cd dist
          git init
          git checkout -b release
          git add .
          git commit -m "Update routing data $(date -u +%Y-%m-%d)"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin release
